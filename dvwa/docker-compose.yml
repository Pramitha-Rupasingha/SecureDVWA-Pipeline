version: '3.8'

services:
  dvwa:
    build:
      context: .
      dockerfile: Dockerfile
    image: dvwa-local:latest
    container_name: dvwa
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
    volumes:
      - ./vulnerabilities/sqli/source/low.php:/var/www/html/vulnerabilities/sqli/source/low.php
      - ./vulnerabilities/xss_r/source/low.php:/var/www/html/vulnerabilities/xss_r/source/low.php
      - ./vulnerabilities/exec/source/low.php:/var/www/html/vulnerabilities/exec/source/low.php
      - ./vulnerabilities/csrf/source/low.php:/var/www/html/vulnerabilities/csrf/source/low.php
    restart: unless-stopped

  db:
    image: mysql:5.7
    container_name: dvwa-db
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    restart: unless-stopped
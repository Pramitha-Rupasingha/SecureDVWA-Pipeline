name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env for CI
        working-directory: ./dvwa
        run: |
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env

      - name: Build and start application stack
        working-directory: ./dvwa
        run: docker compose up -d --build

      - name: Wait for app to become ready
        run: |
          for i in $(seq 1 15); do
            if curl -sSf http://localhost:80 > /dev/null; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app... ($i)"
            sleep 5
          done
          echo "App did not start in time"
          docker compose -f dvwa/docker-compose.yml logs
          exit 1

      - name: Smoke test - login page reachable
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/login.php)
          echo "login.php returned status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Smoke test failed: expected 200, got $STATUS"
            exit 1
          fi
          echo "Smoke test passed"

      - name: Tear down stack
        if: always()
        working-directory: ./dvwa
        run: docker compose down

  security-scans:
    name: DevSecOps Security Gates
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GATE 1: Secrets Scanning
      - name: Gitleaks Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GATE 2: SAST
      - name: Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

      # GATE 3: Dependency / Software Composition Scan
      - name: Trivy Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: false

      # Build OUR own DVWA image (with remediated PHP files baked in)
      # before scanning it, so Trivy scans the image we actually ship,
      # not the unmodified upstream image.
      - name: Build project image
        working-directory: ./dvwa
        run: docker build -t dvwa-local:latest -f Dockerfile .

      # GATE 4: Container Image Scan (against OUR built image)
      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dvwa-local:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: false